name: Publish Shadowed Hearts

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.loader }} to ${{ matrix.site }}
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [CurseForge, Modrinth]
        loader: [Fabric, NeoForge]
    env:
      LOADER: ${{ matrix.loader }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the release tag
        run: grep -Fxq "mod_version=${GITHUB_REF_NAME#v}" gradle.properties || { echo "The release tag must match mod_version."; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Publish to CurseForge
        if: matrix.site == 'CurseForge'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          : "${CURSEFORGE_TOKEN:?Missing CurseForge token}"
          sh gradlew "publishCurseforge${LOADER}" -PpublishLive=true
      - name: Publish to Modrinth
        if: matrix.site == 'Modrinth'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          : "${MODRINTH_TOKEN:?Missing Modrinth token}"
          sh gradlew "publishModrinth${LOADER}" -PpublishLive=true
